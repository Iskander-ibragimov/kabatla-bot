name: Deploy
# push to master -> worker live with the Telegram webhook registered.
# Publishes a diagnostics file deploy.md (no secrets) as the only file of the orphan branch `deploy-report`.
on:
  push:
    branches: [master]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "data/work/**"
      - ".github/trigger/voice-sample"
      - ".github/trigger/fetch-sources"
      - ".github/trigger/voice-*"
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install
        id: install
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Typecheck
        id: typecheck
        run: pnpm typecheck
      - name: Test
        id: test
        run: pnpm test:ci

      - name: Check secrets
        id: secrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
        run: |
          missing=""
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID BOT_TOKEN ADMIN_TG_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          missing="${missing# }"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets: $missing"
            exit 1
          fi

      - name: Derive webhook secret
        id: derive
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          S=$(printf '%s' "${BOT_TOKEN}:kabatla-webhook" | sha256sum | cut -c1-64)
          echo "::add-mask::$S"
          echo "WEBHOOK_SECRET=$S" >> "$GITHUB_ENV"

      - name: Ensure workers.dev subdomain
        id: subdomain
        run: |
          API=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain
          SUB=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" $API | jq -r '.result.subdomain // empty')
          if [ -z "$SUB" ]; then
            SUB="kabatla-$(echo $CLOUDFLARE_ACCOUNT_ID | cut -c1-8)"
            # This name holds the first characters of the account id: it is kept out of this public log, here and in every later step.
            echo "::add-mask::$SUB"
            curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" --data "{\"subdomain\":\"$SUB\"}" $API | jq -c '.success, .errors'
          fi
          echo "sub=$SUB" >> "$GITHUB_OUTPUT"
          echo "workers.dev subdomain: found"

      - name: Ensure D1 database
        id: d1
        run: |
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="kabatla") | .uuid')
          if [ -z "$ID" ]; then
            # What `d1 create` prints holds the id of the new database.
            npx wrangler d1 create kabatla > /dev/null
            ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="kabatla") | .uuid')
          fi
          test -n "$ID"
          # The id of the database is kept out of this public log, here and in every later step (wrangler prints it).
          echo "::add-mask::$ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          echo "D1 database: found"

      - name: Check catalog
        id: catalog
        # Reads files only, and runs before the migrations: a catalog with violations stops the run before anything in
        # the live database is changed. The catalog is data/catalog/a1.csv … c1.csv, one file per level, and there must
        # be one: without a level file the run fails. A CSV file with a wrong name is named by the validation and
        # fails the run too; it is never skipped without a word. The seed is written here and loaded after the migrations.
        run: |
          LEVELS=0
          for slug in a1 a2 b1 b2 c1; do
            if [ -f "data/catalog/$slug.csv" ]; then LEVELS=$((LEVELS + 1)); fi
          done
          FILES=$(find data/catalog -maxdepth 1 -type f -iname '*.csv' 2>/dev/null | wc -l)
          echo "levels=$LEVELS" >> "$GITHUB_OUTPUT"
          echo "Catalog: $LEVELS level files, $FILES CSV files in data/catalog"
          # A level file may be a link, which `find -type f` does not count: either number is enough to go on.
          if [ "$LEVELS" -gt 0 ] || [ "$FILES" -gt 0 ]; then
            set -o pipefail
            npx tsx scripts/validate-catalog.ts 2>&1 | tee "$RUNNER_TEMP/validate.log"
          fi
          if [ "$LEVELS" -eq 0 ]; then
            echo "No catalog: data/catalog holds no level file (a1.csv, a2.csv, b1.csv, b2.csv, c1.csv)"
            exit 1
          fi
          # The validator's last line: «уровней: 1, карточек: 400, нарушений нет».
          ROWS=$(sed -n 's/^уровней: [0-9]*, карточек: \([0-9]*\),.*/\1/p' "$RUNNER_TEMP/validate.log" | tail -n 1)
          case "$ROWS" in ''|*[!0-9]*) ROWS=n/a;; esac
          echo "rows=$ROWS" >> "$GITHUB_OUTPUT"
          npx tsx scripts/csv-to-sql.ts

      - name: Count catalog notes before the migrations
        id: before
        # Read-only. The query fits the database before and after the migrations of the levels A1–C1: in both a catalog
        # note is a note of a deck of kind 'catalog'. On a database that has no tables yet the query fails; the numbers
        # are then n/a, as they are when the database gives no answer within a minute. This step never fails the run.
        run: |
          NOTES="" VOICED=""
          if OUT=$(timeout -k 10 60 npx wrangler d1 execute kabatla --remote --json --command "SELECT COUNT(*) AS notes, COUNT(NULLIF(n.audio_file_id, '')) AS voiced FROM notes n JOIN decks d ON d.id = n.deck_id WHERE d.kind = 'catalog'" 2>/dev/null); then
            NOTES=$(printf '%s' "$OUT" | jq -r '.[0].results[0].notes' 2>/dev/null || true)
            VOICED=$(printf '%s' "$OUT" | jq -r '.[0].results[0].voiced' 2>/dev/null || true)
          else
            echo "The count did not run (a database without tables yet, or no answer)"
          fi
          case "$NOTES" in ''|*[!0-9]*) NOTES=n/a;; esac
          case "$VOICED" in ''|*[!0-9]*) VOICED=n/a;; esac
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "voiced=$VOICED" >> "$GITHUB_OUTPUT"
          echo "Catalog notes before the migrations: $NOTES, voiced: $VOICED"

      - name: Apply migrations
        id: migrations
        run: npx wrangler d1 migrations apply kabatla --remote

      - name: Load catalog
        id: seed
        # The seed was written and its files were checked by «Check catalog», before the migrations. It never deletes.
        run: npx wrangler d1 execute kabatla --remote --file seed/catalog.sql --yes

      - name: Count catalog notes after the load
        id: after
        # Read-only, and it never fails the run: the migrations are applied, so the worker must be deployed whatever is
        # counted here, and a count without an answer within a minute is n/a. `leftover` is the notes of the old catalog
        # (the one before the levels A1–C1) that the load did not find in the files: such a note keeps the provisional
        # place the migration gave it (seq of 100000 and more). It is not every note absent from the files: one whose
        # row was taken out of a file later has its place and is not counted. What does not add up goes to the report
        # as one WARNING line.
        env:
          BEFORE: ${{ steps.before.outputs.notes }}
          ROWS: ${{ steps.catalog.outputs.rows }}
        run: |
          NOTES="" VOICED="" LEFT=""
          if OUT=$(timeout -k 10 60 npx wrangler d1 execute kabatla --remote --json --command "SELECT COUNT(*) AS notes, COUNT(NULLIF(audio_file_id, '')) AS voiced, COALESCE(SUM(seq >= 100000), 0) AS leftover FROM notes WHERE level IS NOT NULL" 2>/dev/null); then
            NOTES=$(printf '%s' "$OUT" | jq -r '.[0].results[0].notes' 2>/dev/null || true)
            VOICED=$(printf '%s' "$OUT" | jq -r '.[0].results[0].voiced' 2>/dev/null || true)
            LEFT=$(printf '%s' "$OUT" | jq -r '.[0].results[0].leftover' 2>/dev/null || true)
          else
            echo "The count did not run (an error, or no answer within a minute)"
          fi
          num() { case "$1" in ''|*[!0-9]*) return 1;; esac; }
          num "$NOTES" || NOTES=n/a
          num "$VOICED" || VOICED=n/a
          num "$LEFT" || LEFT=n/a
          WARN=""
          if num "$NOTES" && num "$ROWS" && [ "$NOTES" -ne "$ROWS" ]; then WARN="$WARN the database holds $NOTES catalog notes, the files $ROWS rows;"; fi
          if num "$NOTES" && num "$BEFORE" && [ "$NOTES" -lt "$BEFORE" ]; then WARN="$WARN catalog notes went down from $BEFORE to $NOTES;"; fi
          if num "$LEFT" && [ "$LEFT" -gt 0 ]; then WARN="$WARN the load did not find $LEFT notes of the old catalog in the files;"; fi
          WARN="${WARN# }"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "voiced=$VOICED" >> "$GITHUB_OUTPUT"
          echo "leftover=$LEFT" >> "$GITHUB_OUTPUT"
          echo "warning=$WARN" >> "$GITHUB_OUTPUT"
          echo "Catalog notes after the load: $NOTES, voiced: $VOICED, notes of the old catalog the load did not find in the files: $LEFT"
          if [ -n "$WARN" ]; then echo "WARNING: $WARN"; fi

      - name: Deploy worker
        id: deploy
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$URL" ]; then URL="https://kabatla-bot.${{ steps.subdomain.outputs.sub }}.workers.dev"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Set worker secrets
        id: wsecrets
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: |
          trap 'rm -f secrets.json' EXIT
          PROVIDERS=$(npx tsx scripts/pick-models.ts)
          echo "providers=$(printf '%s' "$PROVIDERS" | jq 'length')" >> "$GITHUB_OUTPUT"
          jq -n --arg b "$BOT_TOKEN" --arg w "$WEBHOOK_SECRET" --arg a "$ADMIN_TG_ID" --arg p "$PROVIDERS" \
            '{BOT_TOKEN:$b, WEBHOOK_SECRET:$w, ADMIN_TG_ID:$a, LLM_PROVIDERS:$p}' > secrets.json
          npx wrangler secret bulk secrets.json

      - name: Register Telegram webhook and commands
        id: webhook
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          ok=""
          for i in $(seq 1 12); do
            if curl -sf "$WORKER_URL/" > /dev/null; then ok=1; break; fi
            sleep 10
          done
          test -n "$ok" || { echo "Worker did not answer at its URL" | tee "$RUNNER_TEMP/webhook.log"; exit 1; }
          set -o pipefail
          npx tsx scripts/set-webhook.ts 2>&1 | tee "$RUNNER_TEMP/webhook.log"

      - name: Self-check the webhook endpoint
        id: selfcheck
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          NO=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' --data '{"update_id":1}' "$WORKER_URL/tg")
          YES=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -H "X-Telegram-Bot-Api-Secret-Token: $WEBHOOK_SECRET" --data '{"update_id":1}' "$WORKER_URL/tg")
          echo "without secret header: HTTP $NO"
          echo "with secret header: HTTP $YES"
          echo "no=$NO" >> "$GITHUB_OUTPUT"
          echo "yes=$YES" >> "$GITHUB_OUTPUT"
          case "$NO" in 2*) echo "Endpoint accepted a request without the secret"; exit 1;; esac
          test "$YES" = "200"

      - name: Start voicing of notes without audio
        id: voicing
        # The bot is already live here: this step must never fail the deploy.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT=$(npx wrangler d1 execute kabatla --remote --json --command "SELECT COUNT(*) AS n FROM notes WHERE audio_file_id IS NULL AND audio_tries < 3")
          N=$(printf '%s' "$OUT" | jq -r '.[0].results[0].n')
          case "$N" in ''|*[!0-9]*) echo "unexpected count: $N"; exit 1;; esac
          echo "pending=$N" >> "$GITHUB_OUTPUT"
          if [ "$N" -gt 0 ]; then
            gh workflow run voice-db.yml --ref master
            echo "started=yes" >> "$GITHUB_OUTPUT"
          else
            echo "started=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish diagnostics to the deploy-report branch
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
          SHA: ${{ github.sha }}
          S_INSTALL: ${{ steps.install.outcome }}
          S_TYPECHECK: ${{ steps.typecheck.outcome }}
          S_TEST: ${{ steps.test.outcome }}
          S_SECRETS: ${{ steps.secrets.outcome }}
          S_SUBDOMAIN: ${{ steps.subdomain.outcome }}
          S_D1: ${{ steps.d1.outcome }}
          S_CATALOG: ${{ steps.catalog.outcome }}
          S_MIGRATIONS: ${{ steps.migrations.outcome }}
          S_SEED: ${{ steps.seed.outcome }}
          S_DEPLOY: ${{ steps.deploy.outcome }}
          S_WSECRETS: ${{ steps.wsecrets.outcome }}
          S_WEBHOOK: ${{ steps.webhook.outcome }}
          S_SELFCHECK: ${{ steps.selfcheck.outcome }}
          S_VOICING: ${{ steps.voicing.outcome }}
          VOICE_PENDING: ${{ steps.voicing.outputs.pending }}
          VOICE_STARTED: ${{ steps.voicing.outputs.started }}
          MISSING: ${{ steps.secrets.outputs.missing }}
          PROVIDERS: ${{ steps.wsecrets.outputs.providers }}
          LEVELS: ${{ steps.catalog.outputs.levels }}
          CAT_ROWS: ${{ steps.catalog.outputs.rows }}
          DB_BEFORE: ${{ steps.before.outputs.notes }}
          DB_VOICED_BEFORE: ${{ steps.before.outputs.voiced }}
          DB_AFTER: ${{ steps.after.outputs.notes }}
          DB_VOICED_AFTER: ${{ steps.after.outputs.voiced }}
          DB_LEFT: ${{ steps.after.outputs.leftover }}
          CAT_WARNING: ${{ steps.after.outputs.warning }}
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          SC_NO: ${{ steps.selfcheck.outputs.no }}
          SC_YES: ${{ steps.selfcheck.outputs.yes }}
        run: |
          WORKER_HOST="${WORKER_URL#https://}"
          WH_URL="" PENDING="n/a" LAST_ERR="n/a" BOT_USER="n/a" MATCH="n/a"
          if [ -n "$BOT_TOKEN" ]; then
            ME=$(curl -s --max-time 20 "https://api.telegram.org/bot$BOT_TOKEN/getMe" || true)
            BOT_USER=$(printf '%s' "$ME" | jq -r '.result.username // "n/a"' 2>/dev/null || echo n/a)
            INFO=$(curl -s --max-time 20 "https://api.telegram.org/bot$BOT_TOKEN/getWebhookInfo" || true)
            WH_URL=$(printf '%s' "$INFO" | jq -r '.result.url // ""' 2>/dev/null || true)
            PENDING=$(printf '%s' "$INFO" | jq -r '.result.pending_update_count // "n/a"' 2>/dev/null || echo n/a)
            LAST_ERR=$(printf '%s' "$INFO" | jq -r '.result.last_error_message // "(none)" | .[0:200]' 2>/dev/null || echo n/a)
            if [ -n "$WORKER_HOST" ]; then
              case "$WH_URL" in "https://$WORKER_HOST/"*) MATCH=yes;; *) MATCH=no;; esac
            fi
          fi
          CMDS="- commands: n/a"$'\n'
          if [ -n "$BOT_TOKEN" ]; then
            CMDS=""
            for L in default ru tt en; do
              if [ "$L" = default ]; then Q=""; else Q="?language_code=$L"; fi
              R=$(curl -s --max-time 20 "https://api.telegram.org/bot$BOT_TOKEN/getMyCommands$Q" || true)
              N=$(printf '%s' "$R" | jq -r '.result | length' 2>/dev/null || echo n/a)
              NAMES=$(printf '%s' "$R" | jq -r '[.result[].command] | join(",")' 2>/dev/null || echo n/a)
              CMDS="$CMDS- commands ($L): ${N:-n/a}: ${NAMES}"$'\n'
            done
          fi
          WH_OUT=""
          if [ -f "$RUNNER_TEMP/webhook.log" ]; then
            WH_OUT=$(tail -n 15 "$RUNNER_TEMP/webhook.log" | sed -E 's#bot[0-9]+:[A-Za-z0-9_-]+#bot<scrubbed>#g; s#https://api\.telegram\.org[^ ]*#<telegram url>#g')
            for secret in "$BOT_TOKEN" "$WEBHOOK_SECRET" "$ADMIN_TG_ID"; do
              if [ -n "$secret" ]; then WH_OUT="${WH_OUT//"$secret"/<scrubbed>}"; fi
            done
          fi
          VALID_OUT="(not run)" VALID_LINES=0
          if [ -f "$RUNNER_TEMP/validate.log" ]; then
            VALID_OUT=$(head -n 10 "$RUNNER_TEMP/validate.log")
            VALID_LINES=$(wc -l < "$RUNNER_TEMP/validate.log")
          fi
          mkdir -p report
          {
            echo "# deploy report"
            echo
            echo "Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Commit: ${SHA}"
            echo
            echo "## Steps"
            echo "- install: ${S_INSTALL}"
            echo "- typecheck: ${S_TYPECHECK}"
            echo "- test: ${S_TEST}"
            echo "- check secrets: ${S_SECRETS}"
            echo "- workers.dev subdomain: ${S_SUBDOMAIN}"
            echo "- D1 database: ${S_D1}"
            echo "- check catalog: ${S_CATALOG}"
            echo "- migrations: ${S_MIGRATIONS}"
            echo "- load catalog: ${S_SEED}"
            echo "- deploy worker: ${S_DEPLOY}"
            echo "- worker secrets: ${S_WSECRETS}"
            echo "- webhook and commands: ${S_WEBHOOK}"
            echo "- self-check: ${S_SELFCHECK}"
            echo "- start voicing: ${S_VOICING}"
            echo
            echo "## Missing secrets"
            echo "${MISSING:-none}"
            echo
            echo "## Worker"
            echo "- LLM providers selected: ${PROVIDERS:-n/a}"
            echo "- worker host: ${WORKER_HOST:-n/a}"
            echo
            echo "## Catalog"
            echo "- catalog levels in repo: ${LEVELS:-n/a} (check catalog step: ${S_CATALOG}; load catalog step: ${S_SEED})"
            echo "- catalog notes in the database: before ${DB_BEFORE:-n/a}, after ${DB_AFTER:-n/a}; rows in the files: ${CAT_ROWS:-n/a}"
            echo "- voiced catalog notes: before ${DB_VOICED_BEFORE:-n/a}, after ${DB_VOICED_AFTER:-n/a}"
            echo "- notes of the old catalog the load did not find in the files: ${DB_LEFT:-n/a}"
            if [ -n "$CAT_WARNING" ]; then echo; echo "WARNING: ${CAT_WARNING}"; fi
            echo
            echo "## catalog validation (first 10 of ${VALID_LINES} lines; check catalog step: ${S_CATALOG})"
            echo '```'
            echo "${VALID_OUT}"
            echo '```'
            echo
            echo "## Telegram"
            echo "- bot username: ${BOT_USER}"
            echo "- webhook host matches worker: ${MATCH}"
            echo "- pending_update_count: ${PENDING}"
            echo "- last_error_message: ${LAST_ERR}"
            printf '%s' "$CMDS"
            echo
            echo "## webhook and commands output (last 15 lines; warnings: $(printf '%s\n' "$WH_OUT" | grep -c '^WARNING' || true))"
            echo '```'
            echo "${WH_OUT:-(none)}"
            echo '```'
            echo
            echo "## Voicing"
            echo "- notes without audio: ${VOICE_PENDING:-n/a} (voice-db started: ${VOICE_STARTED:-n/a})"
            echo
            echo "## Self-check"
            echo "- POST /tg without secret header: HTTP ${SC_NO:-n/a} (expected: not 2xx)"
            echo "- POST /tg with secret header: HTTP ${SC_YES:-n/a} (expected: 200)"
          } > report/deploy.md
          cd report
          git init -q -b deploy-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy.md
          git commit -q -m "reports: deploy $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" deploy-report
