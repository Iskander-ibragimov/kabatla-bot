name: voice-db
# Voices every note without audio (catalog words and users' own words) in the production database; the Telegram
# file_ids are saved to D1 every 20 notes. Started by the schedule, by hand (input `limit`), and by deploy.yml after a deploy.
# The FIRST step counts pending notes (npx wrangler, no dependency install) and the job ends there when there are none:
# the schedule starts it four times a day, so an empty run must be short. The repository is public: its log, like the
# report, is read by anyone.
# Publishes voice-db.md (counts and note ids only, never users' words) to the orphan branch `voice-db-report`.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Notes to voice in this run, 1..1000 (the schedule uses 200)"
        required: false
        default: "200"
  push:
    paths:
      - .github/trigger/voice-db
permissions:
  contents: write
concurrency: voice-db
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check the limit
        id: limit
        env:
          LIMIT_INPUT: ${{ inputs.limit }}
        run: |
          LIMIT="${LIMIT_INPUT:-200}"
          case "$LIMIT" in ''|*[!0-9]*) echo "limit must be an integer 1..1000"; exit 1;; esac
          if [ "${#LIMIT}" -gt 4 ] || [ "$LIMIT" -lt 1 ] || [ "$LIMIT" -gt 1000 ]; then echo "limit must be an integer 1..1000"; exit 1; fi
          echo "limit=$LIMIT" >> "$GITHUB_OUTPUT"
      - name: Count notes without audio
        id: count
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ID=$(npx --yes wrangler@4 d1 list --json | jq -r '.[] | select(.name=="kabatla") | .uuid')
          test -n "$ID"
          # The id of the database is kept out of this public log, here and in every later step.
          echo "::add-mask::$ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          OUT=$(npx --yes wrangler@4 d1 execute kabatla --remote --json --command "SELECT COUNT(*) AS n FROM notes WHERE audio_file_id IS NULL AND audio_tries < 3")
          N=$(printf '%s' "$OUT" | jq -r '.[0].results[0].n')
          case "$N" in ''|*[!0-9]*) echo "unexpected count: $N"; exit 1;; esac
          echo "pending=$N" >> "$GITHUB_OUTPUT"
          echo "pending notes: $N"
      - name: Install dependencies
        id: install
        if: steps.count.outputs.pending != '0'
        run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Install ffmpeg
        id: ffmpeg
        if: steps.count.outputs.pending != '0'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Voice the notes
        id: voice
        if: steps.count.outputs.pending != '0'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
          AUDIO_CHAT_ID: ${{ secrets.AUDIO_CHAT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIMIT: ${{ steps.limit.outputs.limit }}
          REPORT_FILE: out/voice-run.md
        run: pnpm exec tsx scripts/voice.ts db --limit "$LIMIT"
      - name: Publish diagnostics to the voice-db-report branch
        if: always()
        env:
          S_LIMIT: ${{ steps.limit.outcome }}
          S_COUNT: ${{ steps.count.outcome }}
          S_INSTALL: ${{ steps.install.outcome }}
          S_FFMPEG: ${{ steps.ffmpeg.outcome }}
          S_VOICE: ${{ steps.voice.outcome }}
          PENDING: ${{ steps.count.outputs.pending }}
          AUDIO_CHAT_SET: ${{ secrets.AUDIO_CHAT_ID != '' }}
        run: |
          mkdir -p out report
          {
            echo "# voice-db diagnostics"
            echo
            echo "Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Target chat: $([ "$AUDIO_CHAT_SET" = true ] && echo 'AUDIO_CHAT_ID' || echo 'ADMIN_TG_ID (no AUDIO_CHAT_ID secret)')"
            echo
            echo "## Steps"
            echo "- check limit: ${S_LIMIT}"
            echo "- count pending notes: ${S_COUNT}"
            echo "- install dependencies: ${S_INSTALL}"
            echo "- pending notes before the run: ${PENDING:-n/a}"
            echo "- ffmpeg: ${S_FFMPEG}"
            echo "- voice: ${S_VOICE}"
            echo
            cat out/voice-run.md 2>/dev/null || printf "## Database run\n\n(nothing to voice, or voice.ts wrote no report)\n"
          } > report/voice-db.md
          cd report
          git init -q -b voice-db-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-db.md
          git commit -q -m "reports: voice-db $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-db-report
