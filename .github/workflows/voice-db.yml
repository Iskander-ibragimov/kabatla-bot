name: voice-db
# Voices users' own words (notes without audio_file_id) in the production database and saves the Telegram file_ids.
# The FIRST step counts pending notes and ends the job when there are none, before anything heavy is installed
# (private repository, 2000 Actions minutes a month: an empty run must be short).
# Publishes voice-db.md (counts and note ids only, never users' words) to the orphan branch `voice-db-report`.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/trigger/voice-db
permissions:
  contents: write
concurrency: voice-db
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: master }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Count notes without audio
        id: count
        run: |
          corepack enable pnpm && pnpm install --frozen-lockfile
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="kabatla") | .uuid')
          test -n "$ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          OUT=$(npx wrangler d1 execute kabatla --remote --json --command "SELECT COUNT(*) AS n FROM notes WHERE audio_file_id IS NULL AND audio_tries < 3")
          N=$(printf '%s' "$OUT" | jq -r '.[0].results[0].n')
          case "$N" in ''|*[!0-9]*) echo "unexpected count: $N"; exit 1;; esac
          echo "pending=$N" >> "$GITHUB_OUTPUT"
          echo "pending notes: $N"
      - name: Install ffmpeg
        id: ffmpeg
        if: steps.count.outputs.pending != '0'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Voice the notes
        id: voice
        if: steps.count.outputs.pending != '0'
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_TG_ID: ${{ secrets.ADMIN_TG_ID }}
          AUDIO_CHAT_ID: ${{ secrets.AUDIO_CHAT_ID }}
          REPORT_FILE: out/voice-run.md
        run: pnpm exec tsx scripts/voice.ts db
      - name: Publish diagnostics to the voice-db-report branch
        if: always()
        env:
          S_COUNT: ${{ steps.count.outcome }}
          S_FFMPEG: ${{ steps.ffmpeg.outcome }}
          S_VOICE: ${{ steps.voice.outcome }}
          PENDING: ${{ steps.count.outputs.pending }}
          AUDIO_CHAT_SET: ${{ secrets.AUDIO_CHAT_ID != '' }}
        run: |
          mkdir -p out report
          {
            echo "# voice-db diagnostics"
            echo
            echo "Run: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Target chat: $([ "$AUDIO_CHAT_SET" = true ] && echo 'AUDIO_CHAT_ID' || echo 'ADMIN_TG_ID (no AUDIO_CHAT_ID secret)')"
            echo
            echo "## Steps"
            echo "- count pending notes: ${S_COUNT}"
            echo "- pending notes before the run: ${PENDING:-n/a}"
            echo "- ffmpeg: ${S_FFMPEG}"
            echo "- voice: ${S_VOICE}"
            echo
            cat out/voice-run.md 2>/dev/null || printf "## Database run\n\n(nothing to voice, or voice.ts wrote no report)\n"
          } > report/voice-db.md
          cd report
          git init -q -b voice-db-report
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice-db.md
          git commit -q -m "reports: voice-db $(date -u +%Y-%m-%d)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-db-report
