name: Weekly D1 backup
# Exports the production database and keeps the copy ENCRYPTED: the repository is public, and a file kept by Actions in
# a public repository (an artifact) can be downloaded by any signed-in GitHub user. The dump itself never leaves the
# runner: only backup.sql.enc is uploaded, as the artifact `kabatla-d1-backup-enc`.
# Key: the secret BACKUP_PASSPHRASE when it is set; otherwise hex of HMAC-SHA256(key = bot token, message =
# `kabatla-d1-backup-v1`), which is not the webhook secret (deploy.yml derives that one with another label and function).
# How a copy is opened: docs/OPERATIONS.md, section 7.
on:
  schedule: [{ cron: "17 3 * * 1" }]
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the copy can be encrypted
        # Before anything is exported: without a key the run ends here.
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${BACKUP_PASSPHRASE:-}" ]; then
            echo "key: the secret BACKUP_PASSPHRASE"
          elif [ -n "${BOT_TOKEN:-}" ]; then
            echo "key: derived from the bot token (there is no secret BACKUP_PASSPHRASE)"
          else
            echo "Neither BACKUP_PASSPHRASE nor BOT_TOKEN is set: the copy could not be encrypted, so nothing is exported"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - name: Point wrangler at the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="kabatla") | .uuid')
          test -n "$ID"
          # The id of the database is kept out of this public log, here and in every later step.
          echo "::add-mask::$ID"
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
      - name: Export the database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # wrangler prints the id of the database and a link that downloads the whole dump for an hour: none of its
          # output goes to the log as it is. It prints no rows; the dump goes to the file.
          if ! npx wrangler d1 export kabatla --remote --output backup.sql > "$RUNNER_TEMP/export.log" 2>&1; then
            echo "wrangler d1 export failed; its last lines, with links and ids taken out:"
            tail -n 20 "$RUNNER_TEMP/export.log" | sed -E 's#https?://[^[:space:]]*#<link>#g; s#[0-9a-fA-F]{8}(-[0-9a-fA-F]{4}){3}-[0-9a-fA-F]{12}#<id>#g; s#[0-9a-fA-F]{32,}#<id>#g' || true
            rm -f backup.sql "$RUNNER_TEMP/export.log"
            exit 1
          fi
          rm -f "$RUNNER_TEMP/export.log"
          if [ ! -s backup.sql ]; then echo "The export is empty: nothing to keep"; rm -f backup.sql; exit 1; fi
          echo "exported"
      - name: Encrypt the copy, check it, remove the dump
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          # Whatever happens below, the dump does not outlive this step.
          trap 'rm -f backup.sql' EXIT
          if [ -n "${BACKUP_PASSPHRASE:-}" ]; then
            BACKUP_KEY="$BACKUP_PASSPHRASE"
          elif [ -n "${BOT_TOKEN:-}" ]; then
            # The token is read from the environment, never from a command line.
            BACKUP_KEY=$(node -e 'process.stdout.write(require("node:crypto").createHmac("sha256", process.env.BOT_TOKEN).update("kabatla-d1-backup-v1").digest("hex"))')
            echo "::add-mask::$BACKUP_KEY"
          else
            echo "Neither BACKUP_PASSPHRASE nor BOT_TOKEN is set: the copy cannot be encrypted"
            exit 1
          fi
          export BACKUP_KEY
          test -s backup.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:BACKUP_KEY -in backup.sql -out backup.sql.enc
          # The copy is kept only if it opens with the key and gives the dump back, byte for byte.
          PLAIN=$(sha256sum < backup.sql | cut -d' ' -f1)
          if ! OPENED=$(openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:BACKUP_KEY -in backup.sql.enc 2>/dev/null | sha256sum | cut -d' ' -f1) || [ "$OPENED" != "$PLAIN" ]; then
            rm -f backup.sql.enc
            echo "The encrypted copy does not open to the dump: nothing is uploaded"
            exit 1
          fi
          echo "verified"
          echo "backup.sql: $(stat -c %s backup.sql) bytes; backup.sql.enc: $(stat -c %s backup.sql.enc) bytes"
          rm -f backup.sql
      - uses: actions/upload-artifact@v4
        with: { name: kabatla-d1-backup-enc, path: backup.sql.enc, retention-days: 90, if-no-files-found: error, compression-level: 0 }
